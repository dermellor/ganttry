openapi: "3.1.0"
info:
  title: "Zeitlines HTTP API"
  version: "0.1.0"
  description: |-
      Read and write timelines. Served identically by the Vite dev middleware and the deployed edge function: both dispatch through handleTimelineApi in scripts/db/api.ts.

      Authentication: every endpoint sits behind the auth gate when AUTH_REQUIRED=true, except GET /api/pricing/{id}, which is deliberately public. An MCP client may bypass the gate with a valid X-MCP-Token header.

      Concurrency: a PATCH sends the row version in If-Match and gets 409 on a mismatch. A PATCH only touches keys present in the body, so clearing an optional field requires sending it as an explicit null.

      This file is generated — payload schemas come from src/types.ts. See scripts/schema/openapi.ts.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: "Same origin as the viewer"
security:
  - sessionCookie: []
  - mcpToken: []
paths:
  "/api/sources":
    get:
      operationId: getSources
      summary: "List the DB-backed timelines"
      description: "The discovery endpoint. Lists from the default connection, which is why a default must be configured even when per-source connections are in use."
      responses:
        "200":
          description: "The timelines this deployment can serve."
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
        "400":
          description: "invalid_request — a required field is missing or a rule was violated (reversed item extent, overlapping phases)."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "session_expired — the auth gate rejected the request. The client sends the top window to the login."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "not found — unknown timeline, unknown child id, or an unknown sub-resource."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "405":
          description: "method not allowed for this sub-resource."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "server_error — includes the case where no database is configured, which fails loudly rather than serving stale content."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
