  description: |-
      Read and write timelines. Served identically by the Vite dev middleware and the deployed edge function: both dispatch through handleTimelineApi in scripts/db/api.ts.

      Authentication: every endpoint sits behind the auth gate when AUTH_REQUIRED=true, except GET /api/pricing/{id}, which is deliberately public. An MCP client may bypass the gate with a valid X-MCP-Token header.

      Concurrency: a PATCH sends the row version in If-Match and gets 409 on a mismatch. A PATCH only touches keys present in the body, so clearing an optional field requires sending it as an explicit null.

      This file is generated — payload schemas come from src/types.ts. See scripts/schema/openapi.ts.
