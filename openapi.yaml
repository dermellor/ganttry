      summary: "The saved views this caller may see"
      description: |-
          A saved view is a named combination of presentation, grouping dimension and filter selection, stored with the timeline rather than in a browser. The answer carries every view shared with the instance plus the caller's own private ones, sorted by name; somebody else's private view is never in it.

          They are also folded into `GET /api/source/{id}` under `savedViews`, already filtered the same way — one payload serves a database timeline and a static local one alike.
      responses:
        "200":
          description: "The visible saved views."
          content:
