components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: "Session cookie set by the auth gate after Google sign-in, restricted to the allowed e-mail domains. HttpOnly, so a client cannot read it — use GET /api/me to learn the current identity. Only enforced when AUTH_REQUIRED=true."
    mcpToken:
      type: apiKey
      in: header
      name: X-MCP-Token
      description: "Service token that bypasses the interactive login for non-interactive clients such as the MCP server, compared in constant time. Edits made with it are attributed as `mcp`. Inactive when MCP_API_TOKEN is unset."
  schemas:
    PluginRef:
      type: object
      properties:
        id:
          type: string
        config:
          "$ref": "#/components/schemas/Recordstringunknown"
      required:
        - id
      additionalProperties: false
    Recordstringunknown:
      type: object
      additionalProperties: {}
    PluginData:
      "$ref": "#/components/schemas/RecordstringPluginCollectionData"
      description: |-
          Every enabled plugin's rows, keyed by plugin id.

          It sits on the timeline file rather than behind a second request because a local source has no server to ask: a static deploy materializes the file and that copy has to be complete, or the plugin renders nothing. Making the DB path match means one payload shape for both, and it keeps a local timeline self-contained — copying the file copies the plugin's data with it.

          Only plugins actually enabled on the timeline are included, which is the same gate that decides whether their code loads at all.
    RecordstringPluginCollectionData:
      type: object
      additionalProperties:
        "$ref": "#/components/schemas/PluginCollectionData"
    PluginCollectionData:
      "$ref": "#/components/schemas/Recordstringdef-alias-src_types.ts-13517-14693-src_types.ts-0-181101108268078"
      description: "A plugin's collections, keyed by the collection id its manifest declares."
    Recordstringdef-alias-src_types.ts-13517-14693-src_types.ts-0-181101108268078:
      type: object
      additionalProperties:
        type: array
        items:
          "$ref": "#/components/schemas/PluginDataRow"
    PluginDataRow:
      type: object
      properties:
        id:
          type: string
        data:
          "$ref": "#/components/schemas/Recordstringunknown"
        version:
          type: number
        updatedAt:
          type: string
        updatedBy:
          type: string
      required:
        - id
        - data
      additionalProperties: false
      description: |-
          One row of a collection a plugin owns, in the shape it travels in everywhere: the wire, the host API, and the section a local file carries.

          `data` is the plugin's own object, validated against the collection's declared JSON Schema on the write path. Everything beside it is host-managed and a plugin never sets it.

          `version` is the optimistic-lock counter sent back as `If-Match`. What it counts differs by backing store, and the difference is real rather than cosmetic: a DB row has its own counter, so two people can edit two rows of one collection at once; a local file has one version for the whole document, so the same header there means „the file has not changed since you read it". Items already work exactly this way — see „Locking" in docs/plugin-storage.md.

          There is no `sort` field. Order is the array's order in `PluginCollectionData`, which is the only representation a JSON file has; the DB's `sort` column exists to reproduce it and stays behind the repo.
    TimelinePhase:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        start:
          type: string
        end:
          type: string
        duration:
          type:
            - string
            - number
        color:
          type: string
        icon:
          type: string
      required:
        - label
        - start
      additionalProperties: false
    CustomFieldDef:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        type:
          "$ref": "#/components/schemas/CustomFieldType"
        options:
          type: array
          items:
            "$ref": "#/components/schemas/CustomFieldOption"
        group:
          type: string
        width:
          type: string
          enum:
            - half
            - full
        contextMenu:
          type: boolean
      required:
        - key
        - label
        - type
      additionalProperties: false
    CustomFieldType:
      type: string
      enum:
        - text
        - select
        - multi-select
    CustomFieldOption:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
        color:
          type: string
      required:
        - value
      additionalProperties: false
    Pricing:
      type: object
      properties:
        features:
          type: array
          items:
            "$ref": "#/components/schemas/PricingFeature"
        tiers:
          type: array
          items:
            "$ref": "#/components/schemas/PricingTier"
        highlights:
          type: array
          items:
            "$ref": "#/components/schemas/PricingHighlight"
        versions:
          type: array
          items:
            type: string
      required:
        - features
        - tiers
      additionalProperties: false
    PricingFeature:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        group:
          type: string
        description:
          type: string
        version:
          type: string
        nameByVersion:
          "$ref": "#/components/schemas/Recordstringstring"
        descriptionByVersion:
          "$ref": "#/components/schemas/Recordstringstring"
        rowVersion:
          type: number
      required:
        - id
        - name
      additionalProperties: false
    Recordstringstring:
      type: object
      additionalProperties:
        type: string
    PricingTier:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tagline:
          type: string
        useCase:
          type: string
        targetGroup:
          type: string
        price:
          type: string
        values:
          "$ref": "#/components/schemas/Recordstringstringboolean"
        valueVersions:
          "$ref": "#/components/schemas/Recordstringstring"
        rowVersion:
          type: number
      required:
        - id
        - name
        - price
        - values
      additionalProperties: false
    Recordstringstringboolean:
      type: object
      additionalProperties:
        type:
          - string
          - boolean
    PricingHighlight:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        section:
          type: string
        icon:
          type: string
        featureIds:
          type: array
          items:
            type: string
        description:
          type: string
        labelByVersion:
          "$ref": "#/components/schemas/Recordstringstring"
        rowVersion:
          type: number
      required:
        - id
        - label
        - featureIds
      additionalProperties: false
    TimelineFileItem:
      type: object
      properties:
        id:
          type: string
        start:
          type: string
        end:
          type: string
        duration:
          type:
            - string
            - number
        content:
          type: string
        group:
          type: string
        type:
          type: string
          enum:
            - point
            - range
            - background
            - box
        className:
          type: string
        icon:
          type: string
        status:
          "$ref": "#/components/schemas/StatusKey"
        body:
          type: string
        metadata:
          "$ref": "#/components/schemas/Recordstringunknown"
        version:
          type: number
        createdAt:
          type: string
        createdBy:
          type: string
        updatedAt:
          type: string
        updatedBy:
          type: string
      required:
        - content
      additionalProperties: false
    StatusKey:
      type: string
      enum:
        - Open
        - Doing
        - Done
    TimelineFile:
      type: object
      properties:
        "$schema":
          type: string
          description: "Points editors at schema/timeline.schema.json for completion + validation."
        name:
          type: string
        description:
          type: string
        groupBy:
          type: string
        plugins:
          type: array
          items:
            "$ref": "#/components/schemas/PluginRef"
        pluginData:
          "$ref": "#/components/schemas/PluginData"
        phases:
          type: array
          items:
            "$ref": "#/components/schemas/TimelinePhase"
        customFields:
          type: array
          items:
            "$ref": "#/components/schemas/CustomFieldDef"
        pricing:
          "$ref": "#/components/schemas/Pricing"
        items:
          type: array
          items:
            "$ref": "#/components/schemas/TimelineFileItem"
        groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              content:
                type: string
              nestedGroups:
                type: array
                items:
                  type: string
              showNested:
                type: boolean
            required:
              - id
              - content
            additionalProperties: false
      required:
        - items
      additionalProperties: false
    Watermark:
      type: object
      properties:
        v:
          type: number
        n:
          type: number
        t:
          type:
            - string
            - "null"
        pv:
          type: number
        pn:
          type: number
      required:
        - v
        - n
        - t
      additionalProperties: false
    DirectoryUser:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
      required:
        - email
      additionalProperties: false
      description: |-
          One entry of the user directory (`app_users`, served by `GET /api/users`). The e-mail is the identity an item's `metadata.owner` stores; `name` is only for display and may be missing (a row backfilled from edit attribution knows the address but not the name until that person's next visit).

          Structurally a `PresenceUser` (src/presenceModel.ts), which is why the label / initials / hue helpers there serve both: the same person shown as a presence avatar and as an item's owner has to look like the same person.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: "Machine-readable code: version_conflict, invalid_request, not_found, server_error, session_expired, or a short message for 405."
        message:
          type: string
          description: "Human-readable detail, when available."
    Ok:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          enum:
            - true
      description: "Returned by deletes and bulk writes that have nothing to echo back."
