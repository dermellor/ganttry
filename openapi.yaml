      description: "Creates the membership with status `invited` and mints an invitation token. The plain token is in THIS response and nowhere else; only its SHA-256 is stored. Re-inviting an existing address corrects the role and issues a fresh token, and never downgrades a membership that has already been accepted. Needs the `manage` capability."
