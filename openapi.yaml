    post:
      operationId: postSourceByIdSavedView
      summary: "Create a saved view"
      description: |-
          `name` is required; everything else is optional, and a view that states no `mode` deliberately leaves the presentation alone when applied. The `id` is derived from the name unless one is given, counting up on a collision — a stated id that is taken answers 409 instead, because a caller that names one means that one.

          Two fields cost more than `read`: `visibility: "instance"` (publishing to everybody) and an `owner` other than the caller (creating a view **for** somebody, which is what an agent does). Both need `write` and answer 403 otherwise. Creating a private view of one's own needs only `read`, so a `viewer` can keep one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SavedView"
      responses:
        "201":
          description: "The created view."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SavedView"
        "400":
          description: "invalid_request — a required field is missing or a rule was violated (reversed item extent, overlapping phases)."
