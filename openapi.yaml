          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "forbidden — publishing or naming another owner needs write access."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
