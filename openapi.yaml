        in: path
        required: true
        description: "Timeline id. May contain slashes for a namespace, e.g. `acme/plan`; encode each segment."
        schema:
          type: string
    get:
      operationId: getPricingById
      summary: "Retired: the public pricing model"
      description: |-
          Answers **410 Gone** and names its successor, `GET /api/public/plugin/product-roadmap/{id}`.

          It served one plugin from an address of its own, which is the privilege issue #17 removes: a plugin nobody wrote into this repo could never have had a route here. Not an alias and not a redirect, because the payload changed shape — a matrix cell is now its own row in the `tier-values` collection instead of being folded into each tier's `values` map, and that folding is the plugin's knowledge rather than the host's. A consumer silently handed the new shape would render empty columns; a 410 stops its build instead.
      security: []
      deprecated: true
      responses:
        "410":
          description: "Gone. The body carries the successor URL."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: "Session cookie set by the auth gate after Google sign-in, restricted to the allowed e-mail domains. HttpOnly, so a client cannot read it — use GET /api/me to learn the current identity. Only enforced when AUTH_REQUIRED=true."
    mcpToken:
      type: apiKey
      in: header
      name: X-MCP-Token
      description: "Service token that bypasses the interactive login for non-interactive clients such as the MCP server, compared in constant time. Edits made with it are attributed as `mcp`. Inactive when MCP_API_TOKEN is unset."
  schemas:
    SavedView:
      type: object
      properties:
        id:
          type: string
          description: "Unique within its timeline; travels in the hash as `sv=<id>`."
        name:
          type: string
        mode:
          type: string
          description: "The presentation to open in — a `ViewMode` string (`timeline`, `list`, `plugin:<id>:<view>`). Absent means „leave the presentation alone\", which is what makes a view that is only about the narrowing possible."
        groupBy:
          type: string
          description: "The grouping dimension, as `state.groupBy` spells it (`group`, `cf:tier`, …)."
        filters:
          "$ref": "#/components/schemas/Recordstringstring"
          description: "Selected values per filter dimension; the shape `FilterSelection` describes."
        owner:
          type: string
          description: "The address of whoever created it. Empty on a source with no identity."
        visibility:
          "$ref": "#/components/schemas/SavedViewVisibility"
          description: "Defaults to `private` when absent, which is what an older file spells."
        version:
          type: number
          description: "Optimistic-lock counter, server-managed like an item's."
        createdAt:
          type: string
        createdBy:
          type: string
        updatedAt:
          type: string
        updatedBy:
          type: string
      required:
        - id
        - name
      additionalProperties: false
      description: |-
          A named combination of presentation, grouping dimension and filter selection, stored with the timeline rather than in one person's browser.

          The display state itself is per person and per timeline in `localStorage` (docs/editing.md → „Where the display state lives"). That answers „how am I looking at this right now" and cannot answer „the way we look at this every Monday", because it has no name, no second reader and no address.

          What it deliberately does NOT carry is the visible time window. An absolute window ages into something nobody wants to see within a quarter, and „the next three months" is a relative window — a different feature that this one must not smuggle in under the same name.
    Recordstringstring:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    SavedViewVisibility:
      type: string
      enum:
        - private
        - instance
      description: |-
          Who a saved view is for.

          `private` is the default because a half-built narrowing is the normal state of one: somebody sets a filter, keeps it, and refines it over a week. Publishing is a separate act, and it needs `write` — a `viewer` may keep their own without being able to put one in front of everybody (see docs/users.md).
    PluginRef:
      type: object
      properties:
        id:
          type: string
        config:
          "$ref": "#/components/schemas/Recordstringunknown"
        public:
          type: boolean
          description: |-
              Consent to serve this plugin's declared `publicRead` collections without authentication. Absent = no.

              Separate from being enabled, and deliberately so: plenty of timelines carry a pricing model that is not meant to be public, and „the plugin is on" must not be read as „the world may read it". On a `db` source this is the `timeline_plugins.public` column; here it is the same fact on the file, so the decision travels with the document a user owns.
      required:
        - id
      additionalProperties: false
    Recordstringunknown:
      type: object
      additionalProperties: {}
    PluginData:
      "$ref": "#/components/schemas/RecordstringPluginCollectionData"
      description: |-
          Every enabled plugin's rows, keyed by plugin id.

          It sits on the timeline file rather than behind a second request because a local source has no server to ask: a static deploy materializes the file and that copy has to be complete, or the plugin renders nothing. Making the DB path match means one payload shape for both, and it keeps a local timeline self-contained — copying the file copies the plugin's data with it.

          Only plugins actually enabled on the timeline are included, which is the same gate that decides whether their code loads at all.
    RecordstringPluginCollectionData:
      type: object
      additionalProperties:
        "$ref": "#/components/schemas/PluginCollectionData"
    PluginCollectionData:
      "$ref": "#/components/schemas/Recordstringdef-alias-src_types.ts-14245-15421-src_types.ts-0-219321108268078"
      description: "A plugin's collections, keyed by the collection id its manifest declares."
    Recordstringdef-alias-src_types.ts-14245-15421-src_types.ts-0-219321108268078:
      type: object
      additionalProperties:
        type: array
        items:
          "$ref": "#/components/schemas/PluginDataRow"
    PluginDataRow:
      type: object
      properties:
        id:
          type: string
        data:
          "$ref": "#/components/schemas/Recordstringunknown"
        version:
          type: number
        updatedAt:
          type: string
        updatedBy:
          type: string
      required:
        - id
        - data
      additionalProperties: false
      description: |-
          One row of a collection a plugin owns, in the shape it travels in everywhere: the wire, the host API, and the section a local file carries.

          `data` is the plugin's own object, validated against the collection's declared JSON Schema on the write path. Everything beside it is host-managed and a plugin never sets it.

          `version` is the optimistic-lock counter sent back as `If-Match`. What it counts differs by backing store, and the difference is real rather than cosmetic: a DB row has its own counter, so two people can edit two rows of one collection at once; a local file has one version for the whole document, so the same header there means „the file has not changed since you read it". Items already work exactly this way — see „Locking" in docs/plugin-storage.md.

          There is no `sort` field. Order is the array's order in `PluginCollectionData`, which is the only representation a JSON file has; the DB's `sort` column exists to reproduce it and stays behind the repo.
    TimelinePhase:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        start:
          type: string
        end:
          type: string
        duration:
          type:
            - string
            - number
        color:
          type: string
        icon:
          type: string
      required:
        - label
        - start
      additionalProperties: false
    CustomFieldDef:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        type:
          "$ref": "#/components/schemas/CustomFieldType"
        options:
          type: array
          items:
            "$ref": "#/components/schemas/CustomFieldOption"
        group:
          type: string
        width:
          type: string
          enum:
            - half
            - full
        contextMenu:
          type: boolean
      required:
        - key
        - label
        - type
      additionalProperties: false
    CustomFieldType:
      type: string
      enum:
        - text
        - select
        - multi-select
    CustomFieldOption:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
        color:
          type: string
      required:
        - value
      additionalProperties: false
    TimelineFileItem:
      type: object
      properties:
        id:
          type: string
        start:
          type: string
        end:
          type: string
        duration:
          type:
            - string
            - number
        content:
          type: string
        group:
          type: string
        type:
          type: string
          enum:
            - point
            - range
            - background
            - box
        className:
          type: string
        icon:
          type: string
        status:
          "$ref": "#/components/schemas/StatusKey"
        body:
          type: string
        metadata:
          "$ref": "#/components/schemas/Recordstringunknown"
        version:
          type: number
        createdAt:
          type: string
        createdBy:
          type: string
        updatedAt:
          type: string
        updatedBy:
          type: string
      required:
        - content
      additionalProperties: false
    StatusKey:
      type: string
      enum:
        - Open
        - Doing
        - Done
    TimelineFile:
      type: object
      properties:
        "$schema":
          type: string
          description: "Points editors at schema/timeline.schema.json for completion + validation."
        name:
          type: string
        description:
          type: string
        groupBy:
          type: string
        savedViews:
          type: array
          items:
            "$ref": "#/components/schemas/SavedView"
          description: |-
              Named ways of looking at this timeline. On a `db` source these are rows of the `saved_views` table folded in for the caller; in a file they are the store itself, which is what keeps a local timeline self-contained — the same split `pluginData` makes (docs/plugin-storage.md).

              What reaches a client is already filtered by who asked: a private view of somebody else is never in this array.
        plugins:
          type: array
          items:
            "$ref": "#/components/schemas/PluginRef"
        pluginData:
          "$ref": "#/components/schemas/PluginData"
        phases:
          type: array
          items:
            "$ref": "#/components/schemas/TimelinePhase"
        customFields:
          type: array
          items:
            "$ref": "#/components/schemas/CustomFieldDef"
        items:
          type: array
          items:
            "$ref": "#/components/schemas/TimelineFileItem"
        groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              content:
                type: string
              nestedGroups:
                type: array
                items:
                  type: string
              showNested:
                type: boolean
            required:
              - id
              - content
            additionalProperties: false
      required:
        - items
      additionalProperties: false
    Watermark:
      type: object
      properties:
        v:
          type: number
        n:
          type: number
        t:
          type:
            - string
            - "null"
        pv:
          type: number
        pn:
          type: number
      required:
        - v
        - n
        - t
      additionalProperties: false
    DirectoryUser:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
      required:
        - email
      additionalProperties: false
      description: |-
          One entry of the user directory (`app_users`, served by `GET /api/users`). The e-mail is the identity an item's `metadata.owner` stores; `name` is only for display and may be missing (a row backfilled from edit attribution knows the address but not the name until that person's next visit).

          Structurally a `PresenceUser` (src/presenceModel.ts), which is why the label / initials / hue helpers there serve both: the same person shown as a presence avatar and as an item's owner has to look like the same person.
    MemberRole:
      type: string
      enum:
        - admin
        - editor
        - viewer
      description: "Instance-wide role. Deliberately not per timeline (see migration 0016)."
    MemberStatus:
      type: string
      enum:
        - invited
        - active
        - suspended
        - removed
      description: |-
          Lifecycle of one membership.

            (—) --invite--> invited --first sign-in--> active <--> suspended                      \                          \           /                       `--------- removed <-------`---------`
    Member:
      type: object
      additionalProperties: false
      properties:
        role:
          "$ref": "#/components/schemas/MemberRole"
        status:
          "$ref": "#/components/schemas/MemberStatus"
        invitedBy:
          type: string
          description: "Who sent the invitation; absent for rows that predate membership."
        invitedAt:
          type: string
        acceptedAt:
          type: string
          description: "When the invitation was accepted, which is the first successful sign-in."
        inviteExpiresAt:
          type: string
          description: "When an outstanding invitation stops being accepted at sign-in. Absent once accepted: `setMemberStatus` clears it, so a stale expiry cannot later refuse somebody who is long since active."
        lastSeenAt:
          type: string
        email:
          type: string
        name:
          type: string
      required:
        - email
        - role
        - status
      description: |-
          One membership of this instance: a directory entry plus what it may do.

          `Member extends DirectoryUser` is the type-level statement of migration 0016's decision — the directory and the member list are one table, because once an invitation is the only way in they are the same set of people. The rules that read `role` and `status` live in [`src/access.ts`](./access.ts), which is also where the two unions come from, so a role added there cannot be forgotten here.

          Timestamps are ISO strings rather than `Date`, like everything else that crosses the API boundary.
    SettingHome:
      type: string
      enum:
        - env
        - db
        - build
      description: |-
          Where an instance-wide setting's value comes from.

          `env` is the host's environment or the instance profile, `build` is baked into the artefact, `db` is state the running app writes through its own API. No declaration is `db` yet — the plugin install registry is the first one, and it arrives without this union changing, which is the point of declaring the home rather than hardcoding one per setting.
    DeclaredSetting:
      type: object
      properties:
        key:
          type: string
        group:
          type: string
        label:
          type: string
        home:
          "$ref": "#/components/schemas/SettingHome"
        editable:
          type: boolean
          description: "Whether this deployment can change the value here, in the app."
        why:
          type: string
          description: "Why it cannot, when it cannot."
        set:
          type: boolean
          description: "Does this instance set it at all? Served for every setting."
        value:
          type: string
          description: "The effective value — only for settings declared safe to serve."
      required:
        - key
        - group
        - label
        - home
        - editable
        - set
      additionalProperties: false
      description: |-
          One instance-wide setting as served to the operator interface.

          The declaration it comes from lives in [`src/settings.ts`](./settings.ts), together with the reasoning for the two fields that are easy to misread: `value` is absent (rather than empty or masked) whenever the declaration does not allow the value to be served, and `set` is therefore the only thing that can be said about a secret.
    PluginArtifactKind:
      type: string
      enum:
        - builtin
        - url
        - package
        - vendored
      description: |-
          Where a plugin's code came from.

          Recorded rather than inferred, because uninstalling, re-verifying and reinstalling all need to know: a URL can be refetched, a package resolved again, a vendored directory re-read. `builtin` is the honest label for a plugin that shipped inside the build and has no artifact of its own — an instance can only run what it shipped with until the loader exists (issue #14), and calling that anything else would invite a reinstall of something that was never fetched.
    PluginStatus:
      type: object
      additionalProperties: false
      properties:
        loadable:
          type: boolean
          description: "May the host run this plugin's code? False when `problem` is set."
        reason:
          type: string
          enum:
            - disabled
            - api-version
            - invalid-manifest
          description: |-
              Why not, as a code the interface can word itself. Absent when the plugin is fine.

              It exists alongside `problem` because the two have different readers: this one is for the viewer, which is German and must not print a server's English sentence at a user; `problem` is the diagnostic, which carries detail no fixed phrase can (which version, which manifest field) and goes into logs and to whoever wrote the plugin.
        problem:
          type: string
          description: "Why not, in one sentence with the specifics. Absent when the plugin is fine."
        id:
          type: string
        version:
          type: string
          description: "The artifact's own version, as its manifest declared it."
        apiVersion:
          type: string
          description: "The host contract range the artifact was built against, e.g. `^1`."
        artifact:
          type: object
          properties:
            kind:
              "$ref": "#/components/schemas/PluginArtifactKind"
            source:
              type: string
            integrity:
              type: string
          required:
            - kind
          additionalProperties: false
        capabilities:
          type: array
          items:
            type: string
          description: "Capabilities granted at install time — never widened by the plugin itself."
        manifest:
          "$ref": "#/components/schemas/Recordstringunknown"
        enabled:
          type: boolean
          description: "Instance-level off switch. Distinct from „not enabled on this timeline\": this one stops the plugin everywhere without discarding what it stored, which is what makes turning it back on lossless."
        installedAt:
          type: string
        updatedAt:
          type: string
        updatedBy:
          type: string
      required:
        - apiVersion
        - artifact
        - capabilities
        - enabled
        - id
        - loadable
        - manifest
        - version
      description: |-
          An installed plugin plus what the host currently thinks of it — the shape the interface and the loader read.

          `problem` is a sentence for the person who installed it, not a code. A version error nobody can read is indistinguishable from a broken plugin and gets reported as one.
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: "Machine-readable code: version_conflict, invalid_request, not_found, server_error, session_expired, or a short message for 405."
        message:
          type: string
          description: "Human-readable detail, when available."
    Ok:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          enum:
            - true
      description: "Returned by deletes and bulk writes that have nothing to echo back."
