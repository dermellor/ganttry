<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timelines</title>
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/brands.css" />
    <link rel="stylesheet" href="/src/styles/timeline.css" />
  </head>
  <body data-brand="marcel-mellor">
    <header class="app-header">
      <div class="app-title">
        <span class="app-title-mark"></span>
        <h1>Timelines</h1>
      </div>
      <div class="app-controls">
        <label class="control">
          <span>View</span>
          <select id="view-select"></select>
        </label>
        <label class="control">
          <span>Brand</span>
          <select id="brand-select">
            <option value="marcel-mellor">marcel-mellor</option>
            <option value="Acme">Acme</option>
          </select>
        </label>
        <button id="export-btn" class="export-btn" type="button" title="Aktuelle View als statische HTML-Datei herunterladen">Export HTML</button>
      </div>
    </header>
    <main class="app-main">
      <section id="timeline" class="timeline" aria-label="Timeline"></section>
      <aside id="detail" class="detail" hidden>
        <button id="detail-close" class="detail-close" aria-label="Schließen">×</button>
        <h2 id="detail-title"></h2>
        <dl id="detail-meta" class="detail-meta"></dl>
        <article id="detail-body" class="detail-body"></article>
      </aside>
    </main>
    <footer class="app-footer">
      <span id="status" class="status">…</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
