<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timelines</title>
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/detail.css" />
    <link rel="stylesheet" href="/src/styles/forms.css" />
    <link rel="stylesheet" href="/src/styles/wysiwyg.css" />
    <link rel="stylesheet" href="/src/styles/chips.css" />
    <link rel="stylesheet" href="/src/styles/brands.css" />
    <link rel="stylesheet" href="/src/styles/timeline.css" />
    <link rel="stylesheet" href="/src/styles/list.css" />
  </head>
  <body data-brand="marcel-mellor">
    <header class="app-header">
      <div class="app-title">
        <span class="app-title-mark"></span>
        <label class="control">
          <span>View</span>
          <select id="view-select"></select>
        </label>
        <label class="control">
          <span>Ansicht</span>
          <select id="mode-select">
            <option value="timeline">Timeline</option>
            <option value="list">Liste</option>
          </select>
        </label>
        <label class="control control-toggle" id="milestones-control">
          <input type="checkbox" id="milestones-only" />
          <span>Nur Meilensteine</span>
        </label>
        <label class="control" id="brand-control">
          <span>Brand</span>
          <select id="brand-select">
            <option value="marcel-mellor">marcel-mellor</option>
            <option value="Acme">Acme</option>
          </select>
        </label>
      </div>
      <div class="app-controls">
        <div id="presence" class="presence" aria-label="Online" hidden></div>
        <button id="add-btn" class="export-btn add-btn" type="button" title="Neuen Eintrag hinzufügen" hidden>+ Eintrag</button>
      </div>
    </header>
    <main class="app-main">
      <section id="timeline" class="timeline" aria-label="Timeline"></section>
      <section id="list" class="list-view" aria-label="Liste" hidden>
        <div class="list-toolbar">
          <label class="control" id="list-groupby-control">
            <span>Gruppieren</span>
            <select id="list-groupby"></select>
          </label>
        </div>
        <div id="list-body" class="list-body"></div>
      </section>
      <aside id="detail" class="detail" hidden>
        <div class="detail-header">
          <button id="detail-close" class="detail-close" aria-label="Schließen">×</button>
          <h2 id="detail-title"></h2>
        </div>
        <dl id="detail-meta" class="detail-meta"></dl>
        <article id="detail-body" class="detail-body"></article>
      </aside>
    </main>
    <footer class="app-footer">
      <span id="status" class="status">…</span>
      <button id="export-btn" class="export-link" type="button" title="Aktuelle View als statische HTML-Datei herunterladen">Export HTML</button>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
