name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 22 is the floor: the test script passes a glob
        # ('{src,scripts}/**/*.test.ts') to `node --test`, and Node 20 does not
        # expand it ("Could not find …"). Node 20 is also EOL since April 2026.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # Two failures in one step: a committed schema that no longer matches
      # src/types.ts, and a committed data file that violates it. The second is
      # what makes the examples a test rather than decoration.
      - name: JSON Schemas match the types, examples validate
        run: npm run schema:check

      # The route table is hand-written (the dispatcher has no per-route types),
      # so unit tests assert it covers every SUB_KIND in both directions. This
      # step additionally catches a committed openapi.yaml that was not
      # regenerated after a route or type change.
      - name: openapi.yaml matches the routes and types
        run: npm run openapi:check

      # PLUGINS.md is generated from the plugin manifests. Two failures in one
      # step, and reporting only one would make it a silent pass: a stale page
      # (a manifest changed without a regeneration) and a plugin that is not
      # publishable (no catalogue entry, no README, no preview image). The
      # preview itself is NOT regenerated here — it needs a browser, so the check
      # requires the committed file to exist rather than to match.
      - name: Plugin catalogue matches the manifests
        run: npm run plugins:catalogue:check

      # tokens.css and tokens/index.ts are generated from tokens.json. Committed,
      # because a stylesheet cannot import JSON — so a token added to the source
      # without a regeneration would otherwise ship as a name nothing defines,
      # which is how `--surface-alt` came to be used in six rules and declared in
      # none.
      - name: Design tokens match their source
        run: npm run tokens:check

      # The contract in docs/design-system.md, as far as it can be checked:
      # colours named once, spacing from the scale, buttons from the component,
      # and every exported component present in the playground.
      - name: Design-system contract
        run: bash scripts/ci/check-design-system.sh

      # Explanation is what anything generating interface produces by default, and
      # every single instance of it looks reasonable in review — which is why this
      # is a check and not a paragraph. Labels, headings and refusals only.
      - name: Interface text carries no explanation
        run: node scripts/ci/check-ui-text.mjs

      # Nothing else notices a documented env var that no code reads: the schemas
      # cover data files, openapi.yaml covers routes, and no test asserts anything
      # about prose. TIMELINES_NOTES_DIR and TIMELINES_STATIC_ONLY outlived the
      # Markdown notes pipeline in both README and .env.example because of that.
      - name: Documented env vars are actually read
        run: bash scripts/ci/check-env-docs.sh

      # No credentials are configured here on purpose: this is the path a
      # contributor takes after a plain `git clone`. The build discovers no DB
      # timelines and registers only the local sources under data/, non-fatally.
      - name: Build
        run: npm run build

      - name: Generic bundle carries no plugin view code
        run: bash scripts/ci/check-bundle-split.sh

      # No plugin is special: no core import from a plugin folder, no plugin id
      # as a literal outside it, no plugin-specific method on TimelineRepo, no
      # plugin markup in the shell. Runs without a build, so it fails fast.
      - name: No plugin has a privilege a third party lacks
        run: node scripts/ci/check-plugin-isolation.mjs

      # The other direction: the SERVER must not carry the interface. A Netlify
      # Function is bundled by esbuild, which has no loader for a `.css` import, so
      # a server module that reaches one takes every deploy down — while the site
      # keeps serving the last good one and the smoke test still answers. That gap
      # cost a day of unshipped merges; this closes it in CI, which is the only
      # place that sees it before Netlify does.
      - name: The server bundle carries no interface
        run: npm run server-bundle:check

      # Non-blocking for now: the repo carries 2 pre-existing type errors (missing
      # @types/ws, one library signature mismatch). It was 7 until the notes
      # pipeline went, taking the four Dirent ones in its directory walk with it,
      # and one more went with the plugin-specific repo methods. Fixing the rest is
      # its own change; until then this step reports the count without gating a
      # PR. Make it blocking — drop the continue-on-error — as soon as
      # `npm run typecheck` is clean.
      - name: Typecheck (non-blocking)
        run: npm run typecheck
        continue-on-error: true
