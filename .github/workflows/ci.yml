name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # No credentials are configured here on purpose: this is the path a
      # contributor takes after a plain `git clone`. The build discovers no DB
      # timelines and warns about the missing notes directory, both non-fatal.
      - name: Build
        run: npm run build

      - name: Generic bundle carries no pricing view code
        run: bash scripts/ci/check-bundle-split.sh

      # Non-blocking for now: the repo carries 7 pre-existing type errors
      # (node Dirent typing in build-data.ts, missing @types/ws, two library
      # signature mismatches). Fixing those is its own change; until then this
      # step reports the count without gating a PR. Make it blocking — drop the
      # continue-on-error — as soon as `npm run typecheck` is clean.
      - name: Typecheck (non-blocking)
        run: npm run typecheck
        continue-on-error: true
