[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # 22+ so the MCP Function's supabase-js has a native WebSocket (realtime-js),
  # and because the test script's glob needs Node 22 (see engines.node).
  NODE_VERSION = "22"
  # Instance-specific values are NOT committed here — set them per site in the
  # Netlify dashboard (Site settings → Environment variables):
  SECRETS_SCAN_OMIT_KEYS = "ALLOWED_EMAIL_DOMAINS,AUTH_REQUIRED"

# Edge function as global auth gate (runs first on all paths).
[[edge_functions]]
  function = "auth"
  path = "/*"

# Timeline API — runs after auth, serves DB-backed sources from Supabase.
# Falls through to static files for non-DB sources (read-only).
# /api/sources is the discovery endpoint (list of DB timelines).
[[edge_functions]]
  function = "timelines-api"
  path = "/api/source/*"

[[edge_functions]]
  function = "timelines-api"
  path = "/api/sources"

# User directory an item's Owner links to. Same function: it needs the same DB
# drivers and the same auth gate, and serving it registers the caller.
[[edge_functions]]
  function = "timelines-api"
  path = "/api/users"

# The instance's plugin install registry. Instance-level rather than per timeline,
# so it is a sibling of /api/sources. Declared here as well as in the function's
# own `config.path`, because every other route in this deploy is declared here and
# a route that only exists in one of the two places is the one that goes missing.
[[edge_functions]]
  function = "timelines-api"
  path = "/api/plugins"

[[edge_functions]]
  function = "timelines-api"
  path = "/api/plugins/*"

# Membership administration. Same function again: same drivers, same gate, and
# it needs `manage` where the directory above needs a plain read.
[[edge_functions]]
  function = "timelines-api"
  path = "/api/members"

# What this instance is configured as. Same function once more: it reads the
# deploy's environment, which only an edge function running on it can see, and it
# needs `manage` like the member list above.
[[edge_functions]]
  function = "timelines-api"
  path = "/api/settings"

# The caller's own preferences — today the interface language (#153). The same
# function again: it needs the database to read and write the row, and it is the
# one per-person setting a deployment stores. `read`, not `manage`: it is the
# caller's own row, and a viewer who cannot set their own language is the role
# that most needs a readable interface being the one that cannot choose it.
[[edge_functions]]
  function = "timelines-api"
  path = "/api/preferences"

# PUBLIC pricing model for external marketing pages (Astro). No auth (see
# auth.ts excludedPath); serves only the pricing model, never roadmap items.
# Kept as-is while product-roadmap's data still lives in the pricing_* tables;
# see docs/plugin-public-read.md → „What happens to /api/pricing".
[[edge_functions]]
  function = "pricing-api"
  path = "/api/pricing/*"

# The GENERIC public read, for any plugin that declares publicRead and any
# timeline that consented. Served by timelines-api because it needs exactly the
# same driver setup — a second function would be the duplication this replaces.
[[edge_functions]]
  function = "timelines-api"
  path = "/api/public/plugin/*"

# Current-user probe for the header presence badge. Runs after auth, so it only
# sees a session when the gate is active.
[[edge_functions]]
  function = "me"
  path = "/api/me"

# JIRA issue-picker proxy — powers the editor autosuggest. Runs after auth.
# Inactive unless JIRA_ENABLED=true and JIRA_* credentials are set.
[[edge_functions]]
  function = "jira-api"
  path = "/api/jira/search"

# The invitation link lands in the app, not on a 404.
#
# `/invite/<token>` is a real URL an admin hands to somebody, but its landing
# page belongs to #51 and does not exist yet. Without this the link still
# „works" — the auth gate sends the visitor to Google, the membership check
# accepts their invitation, a session is set — and then drops them on Netlify's
# 404, which reads as „the invitation was broken" when in fact they are now in.
#
# 302 rather than a 200 rewrite: the address bar should end up somewhere that
# exists, so a reload does not go back through a path with no page behind it.
# When #51 adds the landing page, this rule is what it replaces.
[[redirects]]
  from = "/invite/*"
  to = "/"
  status = 302
