[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # 22+ so the MCP Function's supabase-js has a native WebSocket (realtime-js),
  # and because the test script's glob needs Node 22 (see engines.node).
  NODE_VERSION = "22"
  # Instance-specific values are NOT committed here — set them per site in the
  # Netlify dashboard (Site settings → Environment variables):
  SECRETS_SCAN_OMIT_KEYS = "ALLOWED_EMAIL_DOMAINS,AUTH_REQUIRED"

# Edge function as global auth gate (runs first on all paths).
[[edge_functions]]
  function = "auth"
  path = "/*"

# Timeline API — runs after auth, serves DB-backed sources from Supabase.
# Falls through to static files for non-DB sources (read-only).
# /api/sources is the discovery endpoint (list of DB timelines).
[[edge_functions]]
  function = "timelines-api"
  path = "/api/source/*"

[[edge_functions]]
  function = "timelines-api"
  path = "/api/sources"

# User directory an item's Owner links to. Same function: it needs the same DB
# drivers and the same auth gate, and serving it registers the caller.
[[edge_functions]]
  function = "timelines-api"
  path = "/api/users"

# Membership administration. Same function again: same drivers, same gate, and
# it needs `manage` where the directory above needs a plain read.
[[edge_functions]]
  function = "timelines-api"
  path = "/api/members"

# PUBLIC pricing model for external marketing pages (Astro). No auth (see
# auth.ts excludedPath); serves only the pricing model, never roadmap items.
[[edge_functions]]
  function = "pricing-api"
  path = "/api/pricing/*"

# Current-user probe for the header presence badge. Runs after auth, so it only
# sees a session when the gate is active.
[[edge_functions]]
  function = "me"
  path = "/api/me"

# JIRA issue-picker proxy — powers the editor autosuggest. Runs after auth.
# Inactive unless JIRA_ENABLED=true and JIRA_* credentials are set.
[[edge_functions]]
  function = "jira-api"
  path = "/api/jira/search"
